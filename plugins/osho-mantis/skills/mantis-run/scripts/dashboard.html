<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Mantis</title>
<link rel="icon" href="data:,">
<style>
/* Jetons Horizon OS (spec §6), recopiés sans dépendance */
:root,[data-theme=dark]{
  color-scheme:dark;
  --bg:#0b0d14;--card:#12151f;--elev:#171b27;--fg:#e7ebf6;--muted:#a6aec8;--faint:#8c94ae;
  --primary:#7ea6ff;--on-primary:#0b0d14;--border:#242a3b;--input:#2f364a;--sel:#1e2847;--sel-fg:#dfe6ff;
  --banner:#18203d;--banner2:#10162b;--muted-bg:#1c2131;--hover:rgb(255 255 255 / .05);
  --scrim:rgb(5 7 12 / .62);--lift:0 24px 80px rgb(0 0 0 / .5);--card-shadow:none;
}
[data-theme=light]{
  color-scheme:light;
  --bg:#eff1f5;--card:#fff;--elev:#f7f8fb;--fg:#0b1a4a;--muted:#46527c;--faint:#626c90;
  --primary:#0050d7;--on-primary:#fff;--border:#e1e5ee;--input:#cfd5e3;--sel:#d5dbf1;--sel-fg:#00185e;
  --banner:#d4daee;--banner2:#e7eaf5;--muted-bg:#eceff6;--hover:rgb(0 24 94 / .05);
  --scrim:rgb(11 26 74 / .32);--lift:0 24px 80px rgb(11 26 74 / .18);--card-shadow:0 1px 2px rgb(0 24 94 / .04);
}
:root{
  --ok:oklch(.72 .15 155);--warn:oklch(.80 .15 85);--bad:oklch(.65 .20 25);
  --crit:oklch(.62 .22 20);--high:oklch(.70 .18 45);--med:oklch(.80 .15 85);--low:oklch(.72 .08 240);
  --sans:"Source Sans 3","Source Sans Pro",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:var(--mono)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Barre du haut */
#topbar{position:sticky;top:0;z-index:4;height:48px;display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--border)}
.logo{width:22px;height:22px;border-radius:7px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sl{color:var(--faint);margin:0 6px}
.crumb #crumb-repo{color:var(--primary)}
#conn{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
#conn .d{width:8px;height:8px;border-radius:50%;background:var(--faint)}
#conn .d.on{background:var(--ok);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn{font-size:15px}
.icon-btn svg{width:16px;height:16px}
[data-theme=dark] .i-moon,[data-theme=light] .i-sun{display:none}

/* Bannière à diagonale */
#banner{position:relative;overflow:hidden;background:var(--banner);padding:22px 24px 20px;border-bottom:1px solid var(--border)}
#banner::after{content:"";position:absolute;inset:0 0 0 auto;width:34%;background:var(--banner2);clip-path:polygon(14% 0,100% 0,100% 100%,0 100%)}
#banner>*{position:relative;z-index:1}
#banner h1{margin:0;font-size:24px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
#banner p{margin:2px 0 0;font-size:13px;color:var(--muted)}
#kpis{display:grid;grid-template-columns:repeat(4,minmax(0,170px));gap:28px;margin-top:18px}
.kpi{border-left:2px solid var(--input);padding-left:12px}
.kpi b{display:block;font:500 28px/1.1 var(--mono)}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.hot{border-left-color:var(--high)}
.kpi.na b{color:var(--faint)}
#fix-branch{display:flex;align-items:center;gap:8px;margin-top:10px}
#fix-branch[hidden]{display:none}

/* Corps */
main{padding:14px 20px 40px;display:grid;gap:12px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--card-shadow);min-width:0}
.tile-h{min-height:44px;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border)}
.tile-h h2{margin:0;font-size:13px;font-weight:600;color:var(--fg)}
.tile-h .act{margin-left:auto;display:flex;gap:8px;align-items:center}
#waiting-banner{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--card-shadow);padding:16px}
#waiting-banner[hidden]{display:none}
#pipeline{border-radius:10px;overflow:hidden;display:flex}

/* Pipeline : vue Cycle (dessin du SIPOC de Kata) : cartes sur fond pointillé, courbes de Bézier, bouts ronds */
#pv{flex:1;min-width:0;overflow-x:auto;padding:14px}
.stg{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.cy-zone{border:1px solid var(--border);border-radius:10px;background-color:color-mix(in oklch,var(--muted-bg) 45%,transparent);
  background-image:radial-gradient(var(--input) 1.3px,transparent 1.3px);background-size:18px 18px;overflow-x:auto}
.cy{position:relative}
.cy-wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.cy-wire{fill:none;stroke-width:1.5}
.cy-wire.done{stroke:color-mix(in oklch,var(--primary) 70%,transparent)}
.cy-wire.running,.cy-wire.flow{stroke:var(--primary);stroke-width:2}
.cy-wire.flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
.cy-wire.pending{stroke:var(--input);stroke-dasharray:4 4}
@keyframes dash{to{stroke-dashoffset:-12}}
.cy-end{position:absolute;width:7px;height:7px;transform:translate(-50%,-50%);border:1.5px solid var(--input);border-radius:50%;background:var(--card)}
.cy-end.done,.cy-end.running,.cy-end.flow{border-color:var(--primary)}
.cy-label{position:absolute;font:700 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.cy-card{position:absolute;display:flex;flex-direction:column;gap:2px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;
  background:var(--card);box-shadow:var(--card-shadow);overflow:hidden}
.cy-card:hover,.cy-card:focus-visible{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 20%,transparent)}
.cy-card .code{font:600 11px var(--mono);letter-spacing:.06em;color:var(--faint)}
.cy-card .nm{font-size:12.5px;font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.cy-card .st{margin-top:auto;font:10.5px var(--mono);color:var(--faint);white-space:nowrap}
.cy-card.done .code{color:var(--ok)}
.cy-card.running{border:1.5px solid var(--primary)}.cy-card.running .code,.cy-card.running .st{color:var(--primary)}
.cy-card.failed{border-color:var(--bad)}.cy-card.failed .code,.cy-card.failed .st{color:var(--bad)}
.cy-card.pending{background:transparent;border-style:dashed}.cy-card.pending .nm{color:var(--muted)}
.cy-card.skipped{border-style:dashed;opacity:.6}.cy-card.skipped .nm{text-decoration:line-through}
.cy-card.appear,.cy-label.appear{animation:appear .5s var(--ease) both}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pv-foot{display:flex;gap:28px;margin-top:12px;padding:10px 4px 2px;font:12px var(--mono);color:var(--faint)}
.pv-foot b{color:var(--fg);font-weight:500}
.split{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:12px;align-items:start}
.side{display:grid;gap:12px}
#actions{display:grid;gap:8px;padding:12px}
#activity{padding:10px 14px;font:11px/1.8 var(--mono);color:var(--faint);max-height:420px;overflow:auto}
#actions:empty::after,#activity:empty::after{font:13px/1.5 var(--sans);color:var(--faint)}
#actions:empty::after{content:"Aucune action disponible."}
#actions .sess{margin:0;font-size:13px;color:var(--fg)}
#actions .stale{margin:-4px 0 0;font-size:12px;color:var(--warn)}
#actions .btn{width:100%}
#actions .hint{margin:0;font-size:12px;color:var(--muted)}
#actions .runcmd{display:flex;gap:6px;align-items:center}
#actions .runcmd code{flex:1;min-width:0;overflow-wrap:anywhere;font:11px var(--mono);background:var(--muted-bg);padding:4px 6px;border-radius:5px}
#actions .runcmd .btn{width:auto}
.cmds{list-style:none;margin:0;padding:8px 0 0;border-top:1px solid var(--border);display:grid;gap:4px;font-size:12px;overflow-wrap:anywhere}
.cmd-err{font-size:12px;color:var(--bad);overflow-wrap:anywhere}
.cmd-st{font-size:12px;align-self:center;overflow-wrap:anywhere}.cmd-st.ok{color:var(--ok)}.cmd-st.bad{color:var(--bad)}
#activity div{overflow-wrap:anywhere}
#activity b{color:var(--muted);font-weight:500;margin-right:6px}
.link{background:none;border:0;padding:0;margin-top:6px;color:var(--primary);font:12px var(--sans);cursor:pointer}
#waiting-banner .wb-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px}
#waiting-banner .q{margin:0;font-size:18px;line-height:1.3;font-weight:600;color:var(--fg);overflow-wrap:anywhere}
#waiting-banner .hint{font-size:13px;color:var(--muted)}
#waiting-banner .opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:0;padding:14px 16px;text-align:left;font:inherit;color:var(--fg);
  background:var(--elev);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease)}
.opt:hover{border-color:var(--faint)}
.opt.rec{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.opt[aria-pressed=true]{background:var(--sel);border-color:var(--primary)}
.opt[aria-disabled=true]{cursor:not-allowed}
.opt[aria-disabled=true]:not([aria-pressed=true]),.opt:disabled{opacity:.45}
.opt .top{display:flex;align-items:center;gap:8px;min-height:26px}
.opt .nm{font-size:20px;line-height:1.2;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.opt .rec-chip{margin-left:auto;font:600 10px/18px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--primary);
  background:color-mix(in oklch,var(--primary) 14%,transparent);border-radius:99px;padding:0 8px;white-space:nowrap}
.opt .sum{font-size:13px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.opt .cost{margin-top:auto;padding-top:10px;border-top:1px solid var(--border);display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font:12px/1.6 var(--mono);color:var(--faint)}
.opt .cost .k{color:var(--muted)}
.opt .cost .v{text-align:right;color:var(--fg)}
.opt .cost.raw{display:block}
.opt .cmd-st,.opt .cmd-err{align-self:stretch;padding-top:8px;border-top:1px solid var(--border)}
.opt .cmd-st.na{color:var(--primary)}
@media (max-width:1023px){#waiting-banner .opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){#waiting-banner .opts{grid-template-columns:1fr}}
#activity:empty::after{content:"Le journal s'affiche ici pendant l'audit."}
@media (max-width:1024px){.split{grid-template-columns:1fr}}

/* Contrôles */
.btn{font-size:13px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--input);background:var(--elev);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn.sm{height:24px;padding:0 9px;font-size:12px;border-radius:5px}
.loading::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:50%;border:1.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#filter{height:30px;width:220px;padding:0 10px;border-radius:6px;border:1px solid var(--input);background:var(--bg);color:var(--fg);font:13px var(--sans)}
#filter::placeholder{color:var(--faint)}
.seg{display:inline-flex;padding:2px;border-radius:6px;border:1px solid var(--input);background:var(--bg)}
.seg button{height:24px;padding:0 10px;border:0;border-radius:4px;background:none;color:var(--muted);font-size:12px;cursor:pointer}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--sel);color:var(--sel-fg);font-weight:600}

/* Kanban */
#board{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr)) auto;gap:10px;padding:10px;align-items:start}
.col{min-width:0}
.col-h{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;padding:2px 2px 8px;font-weight:600}
.col-h i{font-style:normal;margin-left:auto;font:12px var(--mono);color:var(--faint)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.empty{border:1px dashed var(--border);border-radius:6px;padding:10px;font-size:12px;color:var(--faint);text-align:center}
details.col{width:128px}
details.col[open]{width:220px}
details.col summary{list-style:none;cursor:pointer;border-radius:6px}
details.col summary::-webkit-details-marker{display:none}
details.col summary::before{content:"▸";font-size:10px;color:var(--faint);transition:transform .15s var(--ease)}
details.col[open] summary::before{transform:rotate(90deg)}
.fc-card{margin-bottom:8px}
.fc{display:block;width:100%;text-align:left;background:var(--elev);border:1px solid var(--border);border-radius:6px;padding:9px 10px;font-size:13px;cursor:pointer;transition:border-color .15s}
.fc-card:has(.fc-fix) .fc{border-radius:6px 6px 0 0}
.fc-fix{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 10px;background:var(--elev);border:1px solid var(--border);border-top:1px dashed var(--border);border-radius:0 0 6px 6px;font-size:12px;color:var(--muted)}
.fc-fix>span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.fc-fix.fx-failed>span:first-child{color:var(--bad)}
.fc-fix.fx-conflict>span:first-child{color:color-mix(in srgb,var(--warn) 65%,var(--fg))}
.fc-fix.fx-running>span:first-child{color:var(--primary)}
.fc-fix .btn:first-child{margin-left:auto}
.fix-warn{grid-column:1/-1;margin:0;padding:7px 12px;border:1px solid var(--border);border-left:2px solid var(--warn);border-radius:6px;background:var(--elev);font-size:12px;color:var(--muted)}
.fc:hover{border-color:var(--input)}
.fc .ttl{display:block;color:var(--fg);font-weight:600;line-height:1.3;margin-top:6px;overflow-wrap:anywhere}
.fc .loc{display:block;color:var(--faint);font:11px var(--mono);margin-top:3px;overflow-wrap:anywhere}
.sev{display:inline-flex;align-items:center;gap:5px;font:600 10px/16px var(--mono);letter-spacing:.05em;padding:0 7px;border-radius:99px;border:1px solid var(--border);color:var(--fg);white-space:nowrap}
.sev::before{content:"";width:6px;height:6px;border-radius:50%}
.c::before,.dot.c{background:var(--crit)} .h::before,.dot.h{background:var(--high)}
.m::before,.dot.m{background:var(--med)} .l::before,.dot.l{background:var(--low)}
.x::before,.dot.x{background:var(--faint)}
.chips{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.chip{font-size:11px;color:var(--muted);background:var(--muted-bg);border-radius:99px;padding:0 7px}
.chip.verified::before{content:"✓ ";color:var(--ok)}
.chip.fx-merged{color:color-mix(in srgb,var(--ok) 70%,var(--fg))} .chip.fx-failed{color:var(--bad)} .chip.fx-conflict{color:color-mix(in srgb,var(--warn) 65%,var(--fg))}
.chip.fx-ready,.chip.fx-running{color:var(--primary)}

/* Fiche façon Notion « peek » */
#scrim{position:fixed;inset:0;z-index:10;background:var(--scrim);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:36px 20px;animation:fade .18s var(--ease)}
#scrim[hidden]{display:none}
@keyframes fade{from{opacity:0}}
#peek{width:min(860px,100%);max-height:100%;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--lift);animation:rise .18s var(--ease)}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
#scrim.full{padding:0}
#scrim.full #peek{width:100%;height:100%;max-height:none;border-radius:0;border:0}
#scrim.full .peek-in{max-width:1040px;margin:0 auto}
.peek-bar{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 16px;background:var(--card);border-bottom:1px solid var(--border);font:12px var(--mono);color:var(--faint);white-space:nowrap}
.peek-bar .file{overflow:hidden;text-overflow:ellipsis}
.peek-bar .sp{margin-left:auto}
.peek-bar .btn{height:28px;font-family:var(--sans)}
.peek-in{padding:26px 36px 32px}
.peek-in>h2{margin:10px 0 8px;font-size:26px;line-height:1.25;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.stagebar{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.stagebar span{font:10px/18px var(--mono);padding:0 8px;border-radius:99px;border:1px solid var(--border);color:var(--faint)}
.stagebar span.y{border-color:color-mix(in oklch,var(--ok) 50%,var(--border));color:var(--fg)}
.stagebar span.y::before{content:"✓ ";color:var(--ok)}
.stagebar span.rej{border-color:color-mix(in oklch,var(--bad) 50%,var(--border));color:var(--fg)}
.stagebar span.rej::before{content:"✕ ";color:var(--bad)}
.props{display:grid;grid-template-columns:150px 1fr;gap:7px 16px;margin:18px 0 6px;font-size:13px}
.props dt{color:var(--faint)}
.props dd{margin:0;color:var(--fg);overflow-wrap:anywhere}
.props dd.mono{font-size:12px}
.props dd span[aria-hidden]{margin-right:6px}
.na{color:var(--faint)!important}
.ok{color:var(--ok)} .wa{color:var(--warn)} .bad{color:var(--bad)}
.sec{margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.sec>h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sec h4{margin:14px 0 4px;font-size:13px;font-weight:600;color:var(--muted)}
.sec p{margin:0;max-width:72ch;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.sec details summary{cursor:pointer;margin-top:6px;font-size:13px;color:var(--primary)}
.sec details div{margin-top:6px;white-space:pre-wrap;max-width:72ch;line-height:1.6;overflow-wrap:anywhere}
.sec .props{margin:10px 0 0}
pre{margin:8px 0 0;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px 14px;font:12px/1.6 var(--mono);color:var(--muted);overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
pre.diff{padding:8px 0;white-space:pre}
pre.diff div{padding:0 14px}
pre .a{background:color-mix(in oklch,var(--ok) 16%,transparent);color:var(--fg)}
pre .r{background:color-mix(in oklch,var(--bad) 16%,transparent);color:var(--fg)}
pre .hk{color:var(--primary)}
code{font:12px var(--mono);background:var(--muted-bg);border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
.hist{list-style:none;margin:0;padding:0;font-size:13px}
.hist li{display:flex;gap:12px;padding:4px 0;border-bottom:1px solid var(--border)}
.hist li:last-child{border-bottom:0}
.hist time{font:12px/1.65 var(--mono);color:var(--faint);flex:none}
.peek-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--border)}

/* Onglets Suivi / Bilan, coût */
#tabs{margin:12px 20px 0}
#tabs[hidden],#panel-bilan[hidden],#panel-suivi[hidden],#cost-panel[hidden]{display:none}
#cost-line{margin-top:6px}
.linkish{border:0;background:none;padding:0;color:var(--primary);cursor:pointer;font:inherit;font-size:13px;text-decoration:underline dotted}
#cost-panel{margin-top:10px;max-width:640px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px}
#cost-panel table{width:100%;border-collapse:collapse;margin-bottom:10px}
#cost-panel td,#cost-panel th{text-align:left;padding:3px 6px;border-bottom:1px solid var(--border)}
#cost-panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#cost-panel input{height:28px;border-radius:6px;border:1px solid var(--input);background:var(--bg);color:var(--fg);padding:0 8px;font:inherit}
#cost-panel .err{color:var(--bad)}
#bilan-frame{display:block;width:100%;height:78vh;border:0;border-top:1px solid var(--border);border-radius:0 0 10px 10px;background:var(--bg)}
#export-note{font-size:12px;color:var(--muted)}

/* Fil de Claude : onglet en bas à droite, tiroir en bas, lecture seule */
body{padding-bottom:40px} /* la fin de page reste lisible sous l'onglet */
.feed-tab{position:fixed;right:20px;bottom:0;z-index:5;height:34px;padding:0 14px;border:1px solid var(--border);border-bottom:0;
  border-radius:8px 8px 0 0;background:var(--card);color:var(--fg);font:600 13px var(--sans);cursor:pointer;box-shadow:var(--lift)}
.feed-tab[hidden],#feed[hidden],#feed-badge[hidden]{display:none}
#feed-badge{margin-left:6px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--on-primary);font:600 11px var(--mono)}
#feed{position:fixed;left:0;right:0;bottom:0;z-index:6;height:42vh;display:flex;flex-direction:column;background:var(--card);
  border-top:1px solid var(--border);box-shadow:var(--lift);animation:appear .2s var(--ease) both}
.feed-h{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 20px;border-bottom:1px solid var(--border)}
.feed-h h2{margin:0;font-size:13px}.feed-h .ro{font-size:12px;color:var(--faint)}.feed-h .icon-btn{margin-left:auto}
#feed-list{list-style:none;margin:0;padding:14px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;flex:1}
#feed-list li{max-width:min(860px,92%);display:flex;flex-direction:column;gap:2px}
#feed-list .meta{font:11px var(--mono);color:var(--faint)}
#feed-list .bub{padding:8px 12px;border-radius:10px 10px 10px 2px;background:var(--elev);border:1px solid var(--border);
  white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.45}
#feed-list li.claude .bub{background:var(--sel);color:var(--sel-fg);border-color:transparent}
#feed-list li.agent_start .bub,#feed-list li.agent_end .bub{background:none;border-style:dashed;color:var(--muted);font-size:12px;padding:4px 10px}
#feed-list:empty::after{content:"Aucun message pour l'instant.";color:var(--faint);font-size:13px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
window.D = JSON.parse(document.getElementById('data').textContent);
const NA = 'non évalué à ce niveau';
const PENDING = 'pas encore évalué';

const PRODUCER = {production_viability: 'critic', repro_status: 'reproduce', run_command: 'reproduce', repro_output: 'reproduce',
  patch_status: 'patch', patch_diff: 'patch', reattack_status: 'patch', mantis_risk_score: 'calibrate', executive_summary: 'calibrate'};
const SEV = {CRITICAL: ['Critical', 'c'], HIGH: ['High', 'h'], MEDIUM: ['Medium', 'm'], LOW: ['Low', 'l'], REJECTED: ['Écartés', 'x']};
const PROG = [['found', 'Trouvées', 'Trouvé'], ['reviewed', 'Revues', 'Revu'], ['evaluated', 'Évaluées', 'Évalué'],
  ['reproduced', 'Reproduites', 'Reproduit'], ['proposed', 'Correctif proposé', 'Correctif proposé'], ['fixed', 'Corrigées', 'Corrigé']];
const FIX_LABEL = {queued: 'En file…', running: 'Correction en cours', ready: 'Correctif prêt', failed: 'Échec de la correction',
  conflict: 'Conflit avec un autre correctif', merged: 'Corrigée'};
const EXPORT_WARNING = "⚠️ Cette archive contient le détail d'exploits et des secrets en clair. Transmettez-la uniquement par un canal privé.";
const PROPS = [['Statut', 'status'], ['Emplacement', 'code_paths'], ['CWE', 'cwe'], ['Exploitabilité', 'production_viability'],
  ['Reproduction', 'repro_status'], ['Patch', 'patch_status'], ['Re-attaque', 'reattack_status'], ['Score de risque', 'mantis_risk_score']];
const MONO = new Set(['code_paths', 'cwe', 'mantis_risk_score', 'repro_file_path']);
const ICON = {
  status: {VALID: ['✓', 'ok'], PROVISIONALLY_VALID: ['◐', 'wa'], NEEDS_RESEARCH: ['◐', 'wa'], FALSE_POSITIVE: ['✕', 'bad'], DUPLICATE: ['✕', 'bad']},
  repro_status: {reproduced: ['✓', 'ok'], failed_to_reproduce: ['✕', 'bad']},
  patch_status: {VERIFIED_SECURE: ['✓', 'ok'], MITIGATION_PROPOSED: ['◐', 'wa'], VERIFICATION_FAILED: ['✕', 'bad']},

const $ = id => document.getElementById(id);
// état de l'interface, conservé d'un render(D) à l'autre
const ui = {view: (new URLSearchParams(location.search).get('kb') ?? load('mantis.kbView')) === 'progress' ? 'progress' : 'severity', peek: null, full: false, back: null,
  stage: null, activityAll: false, rounds: 0};
let lastMsg = Date.now(); // dernier message du serveur (chargement, snapshot ou ping)
const inflight = new Set(), cmdErr = new Map(); // commandes pas encore vues dans un snapshot, erreurs 400/409 par commande
const sent = new Map(); // clé de commande -> id renvoyé par le POST, pour afficher son accusé à côté du bouton

function load(k) {
  try { return localStorage.getItem(k); } catch (e) { return null; }
}
function save(k, v) {
  try { localStorage.setItem(k, v); } catch (e) { /* stockage indisponible : choix non mémorisé */ }
}
function el(tag, attrs, ...kids) {

}
function val(f, k) {
  const x = f[k];
  if (x == null || x === '' || (Array.isArray(x) && !x.length)) return NA;
  return Array.isArray(x) ? x.join(', ') : String(x);
}
function naText(k) {
  const st = (D.stages || []).find(s => s.key === PRODUCER[k]);
  const live = !(D.meta.finished || D.meta.stopped || D.mode === 'final');
  return st && live && st.status !== 'done' && st.status !== 'skipped' ? PENDING : NA;
}
function dd(f, k) {
  const table = D.labels[k];
  if (val(f, k) === NA) return el('dd', {class: 'na'}, naText(k));
  if (!table) return el('dd', {}, val(f, k));
  const raw = f[k];
  return el('dd', {title: String(raw)}, table[raw] || String(raw));
}
function pad(n) {
  return String(n).padStart(2, '0');
}
function hhmm(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function frDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return d.toLocaleDateString('fr-FR', {day: 'numeric', month: 'long'}) + ' à ' + d.getHours() + ' h ' + pad(d.getMinutes());
}
function fileOf(f) {
  const p = Array.isArray(f.code_paths) ? f.code_paths[0] : f.code_paths;
  return p ? String(p).replace(/:\d.*$/, '') : '';
}
function sevPill(b) {
  const s = SEV[b] || SEV.LOW;
  return el('span', {class: 'sev ' + s[1]}, b === 'REJECTED' ? 'ÉCARTÉ' : b);
}

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('theme-toggle').setAttribute('aria-label', t === 'dark' ? 'Passer au thème clair' : 'Passer au thème sombre');
}
function connLabel(lastMsgAgeS, mode) {
  if (mode !== 'final' && lastMsgAgeS < 15) return 'En direct, mis à jour il y a ' + Math.floor(lastMsgAgeS) + ' s';
  if (mode !== 'final' && lastMsgAgeS < 60) return 'Reconnexion…';
  return 'Hors ligne, données du ' + (hhmm(new Date(Date.now() - lastMsgAgeS * 1000)) || '?');
}
function renderConn() {
  // en mode final, l'âge est celui du fichier : l'heure affichée est celle de sa génération
  const age = (Date.now() - (D.mode === 'final' ? Date.parse(D.generated_at) : lastMsg)) / 1000, txt = connLabel(age, D.mode);
  $('conn').replaceChildren(el('span', {class: 'd' + (txt.startsWith('En direct') ? ' on' : '')}), el('span', {}, txt));
}
function bannerTitle() {
  const m = D.meta, audit = 'Audit' + (m.level ? ' ' + m.level : '');
  if (m.stopped) return audit + ' arrêté';
  if (m.finished || D.mode === 'final') return audit + ' terminé';
  if (m.paused) return audit + ' en pause';
  const run = (D.stages || []).find(s => s.status === 'running');
  if (!run) return audit + ' en cours';
  return audit + ', ' + run.name.charAt(0).toLowerCase() + run.name.slice(1) + ' en cours';
}
function renderBanner() {
  const m = D.meta, s = D.stats, b = s.by_bucket || {};
  $('banner-title').textContent = bannerTitle();
  const start = frDate(m.started_at), parts = [start ? 'Démarré le ' + start : 'Début inconnu'];
  if (m.round) parts.push('tour ' + m.round);
  if (m.duration) parts.push('durée ' + m.duration);
  else if (start && !(m.finished || m.stopped || D.mode === 'final')) {
    const min = Math.max(0, Math.floor((Date.now() - new Date(m.started_at)) / 60000));
    parts.push('écoulé ' + Math.floor(min / 60) + ' h ' + pad(min % 60) + ' min');
  }
  $('banner-sub').textContent = parts.join(', ');
  $('level-note').textContent = m.level_banner || '';
  const n = m.fixes_merged || 0;
  $('fix-branch').hidden = !(n > 0 && m.audit_branch);
  if (n > 0 && m.audit_branch) {
    $('fix-branch').firstElementChild.replaceChildren(n + (n > 1 ? ' correctifs sur ' : ' correctif sur '), el('code', {}, String(m.audit_branch)));
    $('copy-merge').hidden = !m.audit_branch_ok;
  }
  const rej = b.REJECTED || 0, na = !m.reproduce_done && m.level === 'Light';
  const kpis = [
    [s.total - rej, rej ? rej + (rej > 1 ? ' findings écartés non comptés' : ' finding écarté non compté') : ''],
    [(b.CRITICAL || 0) + (b.HIGH || 0), ''],
    na ? ['n/a', 'Pas de reproduction au niveau Light'] : [s.reproduced, ''],
    na ? ['n/a', 'Pas de vérification par re-attaque au niveau Light'] : [s.patched, ''],
  ];
  [...$('kpis').children].forEach((k, i) => {
    k.querySelector('b').textContent = String(kpis[i][0]);
    k.title = kpis[i][1];
    k.classList.toggle('na', kpis[i][0] === 'n/a');
  });
  $('kpis').children[1].classList.toggle('hot', kpis[1][0] > 0);
}
const ST_LABEL = {pending: 'En attente', running: 'En cours', done: 'Terminé', failed: 'Échec', skipped: 'Sauté'};
function dur(s) {
  if (typeof s !== 'number' || s < 0) return '';
  if (s < 60) return s + ' s';
  const m = Math.floor(s / 60);
  return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + pad(m % 60);
}
function clock(ms) {
  const t = Math.floor(ms / 1000);
  return pad(Math.floor(t / 3600)) + ':' + pad(Math.floor(t / 60) % 60) + ':' + pad(t % 60);
}
function elapsed() {
  // T+ : depuis le début de l'audit ; hors direct, jusqu'au dernier changement connu
  const start = Date.parse(D.meta.started_at);
  if (isNaN(start)) return null;
  const live = !(D.meta.finished || D.meta.stopped || D.mode === 'final');
  const end = live ? Date.now() : Date.parse(D.generated_at) - (D.meta.audit_age_s || 0) * 1000;
  return isNaN(end) ? null : clock(Math.max(0, end - start));
}
function roundText() {
  const r = D.meta.round || 1;
  return D.meta.level === 'Overkill' ? r + ' / 3' : String(r);
}
function curOf(s) {
  return D.current && D.current.stage === s.key ? D.current : null;
}
function stageSub(s) {
  const cur = curOf(s);
  if (s.status === 'running') return cur && cur.batch ? 'lot ' + cur.batch : 'en cours';
  if (s.status === 'skipped') return 'sauté';
  if (s.status === 'failed') return 'échec';
  return s.status === 'done' ? dur(s.duration_s) : '';
}
function stageButton(s, cls, ...kids) {
  const b = el('button', {class: 'stg ' + cls + ' ' + s.status, type: 'button', 'data-key': s.key,
    'aria-label': s.name + ', ' + (ST_LABEL[s.status] || s.status)}, ...kids);
  b.addEventListener('click', () => openStage(s.key));
  return b;
}
function stat(label, v, cls) {
  return el('span', {}, label + ' ', el('b', cls ? {class: cls} : {}, v));
}
function wireState(target, listening) {
  // flèche entrante d'une étape : animée seulement si elle tourne et qu'une session Claude travaille
  if (target === 'running') return listening === 'working' ? 'flow' : 'running';
  return target === 'pending' ? 'pending' : 'done';
}
function cycleLayout(cyc, listening) {
  // positions en pixels : rangée 0 = préparation, puis une rangée par tour ; courbes M x y C … (encart.ts de Kata)
  const CY = {w: 116, h: 76, gx: 30, gy: 54, top: 30, left: 16};
  const rows = [{label: 'Préparation', stages: cyc.prep || [], round: 0}].concat((cyc.rounds || []).map(r => ({
    label: 'Tour ' + r.round + (cyc.max_rounds > 1 ? ' / ' + cyc.max_rounds : ''), stages: r.stages || [], round: r.round})));
  const cards = [], wires = [], out = [];
  let width = 0, prev = null;
  rows.forEach((r, ri) => {
    if (!r.stages.length) return;
    const y = CY.top + out.length * (CY.h + CY.gy + 18);
    out.push({label: r.label, x: CY.left, y: y - 20, round: r.round});
    r.stages.forEach((s, i) => {
      const c = Object.assign({}, s, {id: r.round + ':' + s.key, row: out.length - 1, round: r.round,
        x: CY.left + i * (CY.w + CY.gx), y, w: CY.w, h: CY.h});
      cards.push(c);
      width = Math.max(width, c.x + c.w + CY.left);
      if (prev) {
        const across = prev.row !== c.row, st = wireState(c.status, listening);
        let a, b, d;
        if (!across) {
          a = [prev.x + prev.w, prev.y + prev.h / 2]; b = [c.x, c.y + c.h / 2];
          const mx = (a[0] + b[0]) / 2;
          d = `M ${a[0]} ${a[1]} C ${mx} ${a[1]}, ${mx} ${b[1]}, ${b[0]} ${b[1]}`;
        } else {
          a = [prev.x + prev.w / 2, prev.y + prev.h]; b = [c.x + c.w - 24, c.y]; // à droite du libellé de rangée
          const my = (a[1] + b[1]) / 2;
          d = `M ${a[0]} ${a[1]} C ${a[0]} ${my}, ${b[0]} ${my}, ${b[0]} ${b[1]}`;

      }

function renderPipeline(D) {
  const pv = $('pv'), cyc = D.cycle || {prep: D.stages || [], rounds: [], max_rounds: 1};
  const focused = pv.contains(document.activeElement) ? document.activeElement.dataset.id : null;
  const L = cycleLayout(cyc, D.mode === 'final' ? 'none' : D.listening), n = (cyc.rounds || []).length, grew = ui.rounds && n > ui.rounds;
  ui.rounds = n;
  const box = el('div', {class: 'cy', style: `width:${L.width}px;height:${L.height}px`});

    p.setAttribute('d', w.d); p.setAttribute('class', 'cy-wire ' + w.state);
    svg.append(p);
  }
  box.append(svg);
  for (const w of L.wires) for (const [x, y] of [w.a, w.b]) box.append(el('span', {class: 'cy-end ' + w.state, style: `left:${x}px;top:${y}px`, 'aria-hidden': 'true'}));
  const last = L.rows.length - 1;
  L.rows.forEach((r, i) => box.append(el('span', {class: 'cy-label' + (grew && i === last ? ' appear' : ''), style: `left:${r.x}px;top:${r.y}px`}, r.label)));
  for (const c of L.cards) {
    const b = stageButton(c, 'cy-card' + (grew && c.row === last ? ' appear' : ''), el('span', {class: 'code'}, c.code),
      el('span', {class: 'nm'}, c.name), el('span', {class: 'st'}, c.round && c.round < (cyc.rounds || []).length ? (dur(c.duration_s) || 'fait') : (stageSub(c) || ST_LABEL[c.status] || '')));
    b.dataset.id = c.id;
    b.setAttribute('style', `left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px`);
    if (c.round) b.setAttribute('aria-label', c.name + ', tour ' + c.round + ', ' + (ST_LABEL[c.status] || c.status));
    box.append(b);
  }

}
function trail(f) {

    reproduced: f.repro_status === 'reproduced', proposed: !!f.patch_status, fixed: !!(f._fix && f._fix.status === 'merged')};
  const bar = el('div', {class: 'stagebar', role: 'list', 'aria-label': 'Étapes traversées'});
  PROG.forEach(([k, , one]) => {

  });
  if (f._bucket === 'REJECTED') bar.append(el('span', {class: 'rej', role: 'listitem'}, 'Écarté'));

}
function problem(f) {

  if (!desc) s.append(el('p', {class: 'na'}, NA));

  }
  if (f.reasoning) s.append(sub('Analyse de la revue', para(f, 'reasoning')));

}
function impact(f) {
  const s = section('Impact', para(f, 'impact'));

  const rows = [["Position de l'attaquant", 'attacker_position'], ['Privilèges requis', 'privileges_required'],
    ['Interaction utilisateur', 'user_interaction']].filter(([, k]) => f[k]);
  if (rows.length) s.append(props(f, rows));
  return s;
}
function proof(f) {
  const s = section('Preuve et reproduction');
  if (f.repro_file_path) s.append(sub('Script', el('p', {class: 'mono'}, String(f.repro_file_path))));
  if (f.run_command) s.append(sub('Commande', el('pre', {}, String(f.run_command))));
  if (f.repro_output) s.append(sub('Sortie', el('pre', {}, String(f.repro_output))));
  if (s.children.length === 1) s.append(el('p', {class: 'na'}, naText('repro_status')));
  return s;
}
function diff(f) {
  const p = el('pre', {class: 'diff'});
  for (const line of String(f.patch_diff).replace(/\n$/, '').split('\n')) {
    const c = line.startsWith('+') && !line.startsWith('+++') ? 'a' : line.startsWith('-') && !line.startsWith('---') ? 'r'
      : line.startsWith('@@') ? 'hk' : '';

  }
  return p;
}
function fix(f) {
  const s = section('Correctif');
  if (f.mitigation) s.append(para(f, 'mitigation'));
  if (f.patch_diff) {
    s.append(diff(f));
    if (f._bucket !== 'REJECTED') s.append(el('p', {style: 'margin-top:8px'}, 'Appliquer : ',
      el('code', {}, 'git apply osho-mantis/' + D.meta.audit_name + '/patches/' + f._file + '.diff')));
  }
  if (s.children.length === 1) s.append(el('p', {class: 'na'}, naText('patch_status')));
  return s;
}
function historySection(f) {
  const list = el('ol', {class: 'hist'});
  for (const e of (D.activity || []).filter(e => e.finding === f._src).reverse()) {
    list.append(el('li', {}, el('time', {}, hhmm(e.at)), el('span', {}, String(e.text || e.kind || ''))));
  }
  for (const h of Array.isArray(f.history) ? f.history : []) {
    const txt = h && typeof h === 'object' ? Object.entries(h).map(([k, v]) => k + ' : ' + v).join(', ') : String(h);
    list.append(el('li', {}, el('time', {}, ''), el('span', {}, txt)));
  }
  return section('Historique', list.children.length ? list : el('p', {class: 'na'}, 'Aucun événement enregistré.'));
}
function peekActions(f) {
  const box = el('div', {class: 'peek-act'});
  if (D.mode !== 'final' && f._bucket !== 'REJECTED') {
    const by = Object.fromEntries((D.stages || []).map(s => [s.key, s.status]));
    if ('reproduce' in by && by.reproduce !== 'done' && f.repro_status !== 'reproduced') {
      box.append(...cmdButton({action: 'prioritize_repro', finding: f._src}, 'btn pri', 'Prioriser la reproduction'));
    }
    box.append(...cmdButton({action: 'false_positive', finding: f._src}, 'btn', 'Marquer faux positif'));
  }
  if (f.patch_diff) { // copie locale, sans serveur : utile aussi dans le fichier final
    const cp = el('button', {class: 'btn', type: 'button'}, 'Copier le diff');
    cp.addEventListener('click', () => {
      const done = t => { cp.textContent = t; setTimeout(() => { cp.textContent = 'Copier le diff'; }, 1500); };
      if (!navigator.clipboard) return done('Copie impossible');
      navigator.clipboard.writeText(String(f.patch_diff)).then(() => done('Diff copié'), () => done('Copie impossible'));
    });
    box.append(cp);
  }
  return box.children.length ? box : null;
}
function fillPeek(f) {
  const full = el('button', {class: 'btn', type: 'button'}, ui.full ? 'Revenir à la fiche' : 'Ouvrir en pleine page');
  full.addEventListener('click', () => openPeek(f, !ui.full));
  const close = el('button', {class: 'icon-btn', type: 'button', id: 'peek-close', 'aria-label': 'Fermer la fiche'}, '✕');
  close.addEventListener('click', closePeek);
  const file = fileOf(f);
  const bar = el('div', {class: 'peek-bar'}, el('span', {}, String(f._src)), file ? el('span', {'aria-hidden': 'true'}, '·') : null,
    file ? el('span', {class: 'file'}, file) : null, el('span', {class: 'sp'}), full, close);
  const inner = el('div', {class: 'peek-in'}, sevPill(f._bucket), el('h2', {id: 'peek-title'}, String(f.title)), trail(f),
    props(f, PROPS), problem(f), impact(f), proof(f), fix(f), historySection(f), peekActions(f));
  $('peek').replaceChildren(bar, inner);
}
function openPeek(f, full) {
  full = !!full;
  const same = ui.peek === f._src; // _src est stable ; _file peut changer quand un homonyme apparaît
  if (!ui.peek) ui.back = f._src;
  ui.peek = f._src;
  ui.stage = null;
  ui.full = full;
  fillPeek(f);
  $('scrim').classList.toggle('full', full);
  $('scrim').hidden = false;
  document.body.classList.add('locked');
  if (!same) $('peek').scrollTop = 0;
  if (location.hash !== '#' + f._file + (full ? '&full' : '')) location.hash = f._file + (full ? '&full' : '');
  $('peek-close').focus({preventScroll: true});
}
function closePeek() {
  if (!ui.peek && !ui.stage) return;
  const stage = ui.stage;
  ui.peek = ui.stage = null;
  $('scrim').hidden = true;
  document.body.classList.remove('locked');
  if (stage) return (stageFor(stage) || $('pipeline')).focus();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  (cardFor(ui.back) || $('filter')).focus(); // carte disparue (filtre, finding retiré) : retour au filtre
}
function findingForHash(findings, hash) {
  let id;
  try { id = decodeURIComponent((hash || '').replace(/^#/, '').replace(/&full$/, '')); } catch (e) { return null; }
  if (!id) return null;
  return findings.find(x => x._file === id) || null;
}
function openFromHash() {
  const f = findingForHash(D.findings, location.hash), full = /&full$/.test(location.hash);
  if (!f) return ui.peek ? closePeek() : undefined; // un panneau d'étape n'a pas d'ancre
  if (ui.peek !== f._src || ui.full !== full) openPeek(f, full);
}
function trapFocus(e) {
  const items = [...$('peek').querySelectorAll('button, a[href], summary, input')].filter(x => !x.disabled && x.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1], at = document.activeElement;
  if (!$('peek').contains(at)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && at === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && at === last) { e.preventDefault(); first.focus(); }
}

let rendered = false;
function hm(s) {
  if (s == null) return 'inconnu';
  const m = Math.floor(s / 60);
  return Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min';
}
function usd(v) {
  return v == null ? 'coût non calculé' : '≈ ' + Math.round(v).toLocaleString('fr-FR') + ' $';
}
function renderCost() {
  const c = D.meta.cost || {};
  $('cost-btn').textContent = usd(c.usd) + (c.source === 'manuel' ? ' (saisi)' : ' (équivalent API)') +
    ' · ' + hm(c.active_s) + ' actives · ' + hm(c.wall_s) + ' au total';
  const pn = $('cost-panel');
  if (pn.hidden || pn.contains(document.activeElement)) return; // ne pas effacer une saisie en cours
  fillCost(c);
}
function fillCost(c) {
  const pn = $('cost-panel'), rows = Object.entries(c.by_model || {}).sort((a, b) => (b[1].usd || 0) - (a[1].usd || 0));
  const kids = [el('p', {}, 'Estimation au tarif public de l\'API Claude, calculée depuis les transcripts de la session ; pas une facture. ' +
    'Temps actif : travail de la session principale, hors pauses de plus de 2 min.')];
  if (rows.length) kids.push(el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Modèle'), el('th', {}, 'Coût estimé'))),
    el('tbody', {}, ...rows.map(([m, v]) => el('tr', {}, el('td', {class: 'mono'}, m), el('td', {class: 'mono'}, usd(v.usd)))))));
  if ((c.unknown_models || []).length) kids.push(el('p', {}, 'Modèles sans tarif connu : ' + c.unknown_models.join(', ')));
  if (c.note) kids.push(el('p', {}, 'Note : ' + c.note));
  if (D.mode !== 'final') {
    const amount = el('input', {type: 'number', min: '0', step: '0.01', id: 'cost-usd', 'aria-label': 'Coût en dollars', placeholder: 'Montant en $'});
    const note = el('input', {type: 'text', maxlength: '200', id: 'cost-note', 'aria-label': 'Note', placeholder: 'Note (facultative)'});
    const err = el('span', {class: 'err', role: 'status'});
    const save = el('button', {class: 'btn sm pri', type: 'button'}, 'Enregistrer');
    save.addEventListener('click', () => {
      const v = Number(amount.value);
      if (amount.value === '' || !(v >= 0)) { err.textContent = 'Montant invalide'; return; }
      sendCommand({action: 'set_cost', usd: v, note: note.value || null});
    });
    const reset = el('button', {class: 'btn sm', type: 'button'}, 'Revenir au calcul automatique');
    reset.addEventListener('click', () => sendCommand({action: 'set_cost', usd: null}));
    const again = el('button', {class: 'btn sm', type: 'button'}, 'Recalculer');
    again.addEventListener('click', () => sendCommand({action: 'recompute_cost'}));
    kids.push(el('div', {class: 'row'}, amount, note, save, c.source === 'manuel' ? reset : null, again, err));
  }
  pn.replaceChildren(...kids.filter(Boolean));
}
function showTab(t) {
  ui.tab = t === 'bilan' ? 'bilan' : 'suivi';
  save('mantis.tab', ui.tab);
  for (const b of $('tabs').querySelectorAll('button')) b.setAttribute('aria-selected', String(b.dataset.t === ui.tab));
  $('panel-suivi').hidden = ui.tab !== 'suivi';
  $('panel-bilan').hidden = ui.tab !== 'bilan';
  if (ui.tab === 'bilan') loadBilan();
}
let bilanAt = 0;
function loadBilan() {
  // live : régénéré au plus toutes les 30 s pendant que l'onglet est ouvert ; final : le fichier voisin
  const fr = $('bilan-frame');
  if (D.mode === 'final') { if (!fr.getAttribute('src')) fr.src = 'bilan.html'; return; }
  if (Date.now() - bilanAt < 30000 && fr.getAttribute('src')) return;
  bilanAt = Date.now();
  fr.src = '/bilan?t=' + bilanAt;
}
function renderExports() {
  const fin = D.mode === 'final';
  $('export-light').hidden = $('export-full').hidden = fin;
  $('export-note').textContent = fin ? 'Exports disponibles avec le dashboard en direct' : '';
}
function exportAudit(kind) {
  if (!confirm(EXPORT_WARNING + '\n\nLa liste des secrets à révoquer est dans le bilan et dans LISEZMOI-DEV.md. Continuer ?')) return;
  location.href = '/export?kind=' + kind;
}
const FEED_DOM = 500;
let feedSt = {items: [], last: 0, unseen: 0}, feedTimer = null;
function appendFeed(st, r, open, max) {
  // nouveaux messages du fil, sans doublon, plafonnés aux max derniers ; non lus comptés panneau fermé
  const seen = new Set(st.items.map(i => i.seq)), add = (r.items || []).filter(i => !seen.has(i.seq));
  return {items: st.items.concat(add).slice(-max), last: Math.max(st.last, r.last || 0), unseen: open ? 0 : st.unseen + add.length};
}
function feedOpen() {
  return !$('feed').hidden;
}
function feedItem(i) {
  const li = el('li', {class: (i.who === 'Claude' ? 'claude ' : '') + i.kind});
  li.append(el('span', {class: 'meta'}, (hhmm(i.at) || '') + ' · ' + String(i.who || '')), el('div', {class: 'bub'}, String(i.text || '')));
  return li;
}
function drawFeed(added) {
  const list = $('feed-list'), atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  for (const i of added) list.append(feedItem(i));
  while (list.children.length > FEED_DOM) list.firstElementChild.remove();
  if (atBottom) list.scrollTop = list.scrollHeight;
  const b = $('feed-badge');
  b.hidden = !feedSt.unseen;
  b.textContent = feedSt.unseen > 99 ? '99+' : String(feedSt.unseen);
}
function pollFeed() {
  clearTimeout(feedTimer);
  fetch('/feed?after=' + feedSt.last, {credentials: 'same-origin'}).then(r => r.ok ? r.json() : null).catch(() => null).then(r => {
    if (r) {
      const before = new Set(feedSt.items.map(i => i.seq));
      feedSt = appendFeed(feedSt, r, feedOpen(), FEED_DOM);
      drawFeed(feedSt.items.filter(i => !before.has(i.seq)));
    }
    feedTimer = setTimeout(pollFeed, feedOpen() ? 2000 : 10000);
  });
}
function toggleFeed(open) {
  $('feed').hidden = !open;
  $('feed-tab').hidden = open;
  $('feed-tab').setAttribute('aria-expanded', String(open));
  if (open) {
    feedSt.unseen = 0;
    if (D.mode === 'final') { // fichier figé : les transcripts ne sont jamais copiés, le fil n'existe qu'en direct
      $('feed-list').replaceChildren(el('li', {class: 'agent_start'}, el('div', {class: 'bub'},
        "Fil en direct disponible quand le dashboard est servi par Claude (mantis-run). Ce fichier est une copie figée : " +
        "les messages de Claude n'y sont pas enregistrés.")));
      $('feed-close').focus();

    const list = $('feed-list');

}
function render(snap) {
  const first = !rendered;
  rendered = true;
  window.D = snap;
  settleSent();
  const m = D.meta;
  document.title = 'Mantis · ' + (m.repo_name || 'audit');
  $('crumb-repo').textContent = m.repo_name || 'repo';
  $('crumb-audit').textContent = m.audit_name || '';

  renderBanner();
  renderCost();
  renderExports();
  if (ui.tab === 'bilan') loadBilan();
  renderWaiting();
  renderPipeline(D);
  renderBoard(!first);
  renderActions();
  renderActivity();
  announce(first);
  if (ui.peek || ui.stage) {
    const f = ui.peek && D.findings.find(x => x._src === ui.peek), s = ui.stage && (D.stages || []).find(x => x.key === ui.stage);
    if (!f && !s) return closePeek();
    const pk = $('peek'), top = pk.scrollTop;
    if (!keepFocus(pk, () => f ? fillPeek(f) : fillStage(s))) $('peek-close').focus({preventScroll: true});
    pk.scrollTop = top;
  }
}
function tick() {
  // chaque seconde en direct : âge de la connexion et compteurs T+, sans tout redessiner
  renderConn();
  const t = elapsed();
  if (t) for (const b of document.querySelectorAll('.tplus')) b.textContent = t;
}

const stored = load('mantis.theme');
applyTheme(stored === 'light' || stored === 'dark' ? stored : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');

$('filter').addEventListener('input', () => renderBoard());
$('copy-merge').addEventListener('click', () => {
  const cp = $('copy-merge'), done = t => { cp.textContent = t; setTimeout(() => { cp.textContent = 'Copier git merge'; }, 1500); };
  if (!navigator.clipboard) return done('Copie impossible');
  navigator.clipboard.writeText('git merge ' + D.meta.audit_branch).then(() => done('Copié'), () => done('Copie impossible'));
});
$('feed-tab').addEventListener('click', () => toggleFeed(true));
$('feed-close').addEventListener('click', () => toggleFeed(false));
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.t); });

$('export-full').addEventListener('click', () => exportAudit('full'));
$('cost-btn').addEventListener('click', () => {
  const pn = $('cost-panel'), open = pn.hidden;

  $('cost-btn').setAttribute('aria-expanded', String(open));

});
$('scrim').addEventListener('click', e => { if (e.target === $('scrim')) closePeek(); });
document.addEventListener('keydown', e => {
  if (!ui.peek && !ui.stage) { if (e.key === 'Escape' && feedOpen()) toggleFeed(false); return; }
  if (e.key === 'Escape') { e.preventDefault(); closePeek(); } else if (e.key === 'Tab') trapFocus(e);
});
window.addEventListener('hashchange', openFromHash);
render(D);
showTab(location.hash === '#bilan' ? 'bilan' : load('mantis.tab'));
openFromHash();
if (D.mode === 'live') {
  pollFeed();
  const es = new EventSource('/events'); // cookie de session envoyé : même origine
  es.addEventListener('snapshot', e => {
    lastMsg = Date.now();
    let snap;
    try { snap = JSON.parse(e.data); } catch (x) { return; } // message tronqué : on garde l'affichage
    if (snap.listening !== D.listening) cmdErr.clear(); // une erreur ne vaut que pour l'état de session où elle est née
    render(snap);
  });
  es.addEventListener('ping', () => { lastMsg = Date.now(); });
  setInterval(tick, 1000);
}
